<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>Please sign · LCC Bathrooms &amp; Services</title>
<link rel="icon" href="/img/icon-192.png">
<style>
  :root { --ink: #0f1f24; --muted: #5b6b70; --line: #dfe6e8; --brand: #00838f; --soft: #f4f8f9; --red: #b42318; --green: #067647; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  header img { width: 64px; height: 64px; }
  header b { display: block; } header small { color: var(--muted); }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .card { border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 16px 0; }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .06em; padding: 3px 10px; border-radius: 99px; }
  .pill.add { background: #ecfdf3; color: var(--green); } .pill.rm { background: #fef3f2; color: var(--red); }
  .desc { white-space: pre-wrap; margin: 10px 0 0; }
  .decl { font-style: italic; color: var(--muted); }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  input { width: 100%; font: inherit; padding: 12px; border: 2px solid var(--line); border-radius: 10px; }
  input:focus, canvas:focus { outline: 3px solid #00838f55; border-color: var(--brand); }
  canvas { display: block; width: 100%; height: 200px; background: #fff; border: 2px dashed var(--line); border-radius: 10px; touch-action: none; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .link { background: none; border: 0; color: var(--brand); font: inherit; font-weight: 600; padding: 8px 0; cursor: pointer; }
  .btn { width: 100%; min-height: 54px; margin-top: 18px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; font: inherit; font-weight: 700; font-size: 17px; cursor: pointer; }
  .btn:disabled { opacity: .6; }
  .err { color: var(--red); font-weight: 600; }
  .done { text-align: center; } .done .tick { font-size: 48px; color: var(--green); }
  .sig { max-width: 100%; max-height: 120px; }
  .photos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
  .photos figure { margin: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .photos img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--soft); cursor: zoom-in; }
  .photos figcaption { padding: 6px 8px; font-size: 13px; }
  .photos figcaption b { display: block; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  /* full-screen photo viewer: close, previous/next, swipe, double-tap to zoom (then drag to look around) */
  dialog.viewer { position: fixed; inset: 0; width: 100vw; height: 100dvh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: #000; color: #fff; overflow: hidden; }
  dialog.viewer::backdrop { background: #000; }
  .v-stage { position: absolute; inset: 0; overflow: auto; display: grid; place-items: center; -webkit-overflow-scrolling: touch; }
  .v-stage img { max-width: 100vw; max-height: 100dvh; object-fit: contain; }
  .v-stage.zoomed { place-items: start; }
  .v-stage.zoomed img { max-width: none; max-height: none; width: 250vw; }
  .v-top { position: absolute; z-index: 2; top: 0; left: 0; right: 0; display: flex; align-items: flex-start; gap: 12px; padding: max(12px, env(safe-area-inset-top)) 12px 24px; background: linear-gradient(#000c, #0000); }
  .v-cap { flex: 1; font-size: 15px; line-height: 1.35; } .v-cap b { display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; opacity: .8; }
  .v-btn { flex: none; min-width: 48px; height: 48px; border: 1px solid #ffffff59; border-radius: 24px; background: #000000a6; color: #fff; font: inherit; font-size: 26px; line-height: 1; cursor: pointer; }
  .v-close { font-size: 16px; font-weight: 700; padding: 0 16px; }
  .v-prev, .v-next { position: absolute; z-index: 2; top: 50%; transform: translateY(-50%); }
  .v-prev { left: 10px; } .v-next { right: 10px; }
  .v-count { position: absolute; z-index: 2; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom)); text-align: center; font-size: 14px; color: #ffffffcc; }
  .v-hint { display: block; font-size: 12px; opacity: .7; margin-top: 2px; }
</style>
</head>
<body>
<main>
  <header><img src="/img/logo.png" alt="LCC Bathrooms & Services Ltd logo"><div><b>LCC Bathrooms &amp; Services Ltd</b><small id="sub">Please review and sign</small></div></header>
  <div id="app"><p class="muted">Loading…</p></div>
</main>
<script>
const code = location.pathname.split('/').pop(), app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const when = (d) => new Date(d).toLocaleString('en-GB', { timeZone: 'Europe/London', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
// a change to the work, or the photos of the property's condition
const what = (c) => c.kind === 'condition' ? photoGrid(c) : changeCard(c);
const photoGrid = (c) => `<p class="muted">${c.photos.length} photo${c.photos.length === 1 ? '' : 's'} taken before any work started. Tap a photo to see it full screen.</p>
  <div class="photos">${c.photos.map((p, i) => `<figure><img src="${esc(p.url)}" alt="Photo ${i + 1}" loading="lazy" data-big="${i}">
    <figcaption>${p.area ? `<b>${esc(p.area)}</b>` : ''}${esc(p.note || '')}</figcaption></figure>`).join('')}</div>`;
let photos = [];
document.addEventListener('click', (e) => { if (e.target.matches('[data-big]')) viewer(photos, Number(e.target.dataset.big)); });
function viewer(list, i) {
  const d = document.createElement('dialog');
  d.className = 'viewer';
  const many = list.length > 1;
  d.innerHTML = `<div class="v-top"><div class="v-cap" aria-live="polite"></div><button class="v-btn v-close" data-close>✕ Close</button></div>
    <div class="v-stage"><img alt=""></div>
    ${many ? '<button class="v-btn v-prev" aria-label="Previous photo">‹</button><button class="v-btn v-next" aria-label="Next photo">›</button>' : ''}
    <div class="v-count"></div>`;
  const stage = d.querySelector('.v-stage'), img = stage.querySelector('img');
  const show = () => {
    const p = list[i];
    stage.classList.remove('zoomed');
    img.src = p.url; img.alt = `Photo ${i + 1}`;
    d.querySelector('.v-cap').innerHTML = `${p.area ? `<b>${esc(p.area)}</b>` : ''}${esc(p.note || '')}<span class="v-hint">Double-tap to zoom</span>`;
    d.querySelector('.v-count').textContent = many ? `${i + 1} of ${list.length}` : '';
  };
  const step = (n) => { i = (i + n + list.length) % list.length; show(); };
  d.querySelector('[data-close]').onclick = () => d.close();
  d.querySelector('.v-prev')?.addEventListener('click', () => step(-1));
  d.querySelector('.v-next')?.addEventListener('click', () => step(1));
  d.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); });
  const zoom = (x, y) => {
    if (stage.classList.toggle('zoomed')) { const r = img.getBoundingClientRect(); stage.scrollTo((x / innerWidth) * (r.width - innerWidth), (y / innerHeight) * (r.height - innerHeight)); }
  };
  img.addEventListener('dblclick', (e) => zoom(e.clientX, e.clientY));
  let t0 = null, lastTap = 0;
  stage.addEventListener('touchstart', (e) => { t0 = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null; }, { passive: true });
  stage.addEventListener('touchend', (e) => {
    if (!t0) return;
    const t = e.changedTouches[0], dx = t.clientX - t0.x, dy = t.clientY - t0.y;
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) { // tap: two quick taps zoom
      if (Date.now() - lastTap < 300) { e.preventDefault(); zoom(t.clientX, t.clientY); lastTap = 0; } else lastTap = Date.now();
    } else if (!stage.classList.contains('zoomed') && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1); // swipe
    t0 = null;
  });
  d.addEventListener('close', () => d.remove());
  document.body.append(d); d.showModal(); show();
}
const changeCard = (c) => `<div class="card"><span class="pill ${c.type === 'Remove' ? 'rm' : 'add'}">${c.type === 'Remove' ? 'REMOVE FROM AGREED WORK' : 'ADD TO AGREED WORK'}</span>
  <p class="desc">${esc(c.description)}</p></div>`;

function signed(c) {
  app.innerHTML = `<div class="done"><div class="tick">✓</div><h1>Signed — thank you</h1><p class="muted">${esc(c.address)}</p></div>${what(c)}
    <div class="card"><p class="decl">${esc(c.declaration)}</p><img class="sig" src="${esc(c.signature)}" alt="Signature"><p><b>${esc(c.customerName)}</b><br><span class="muted">Signed ${when(c.signedAt)}</span></p></div>
    <p class="muted">You can close this page. LCC has a copy.</p>`;
}

function form(c) {
  app.innerHTML = `<h1>${c.kind === 'condition' ? 'Condition of your property' : 'Please review and sign'}</h1><p class="muted">${[c.address, c.jobId].filter(Boolean).map(esc).join(' · ')}</p>${what(c)}
    <p class="decl">${esc(c.declaration)}</p>
    <label for="name">Your full name</label><input id="name" autocomplete="name" value="${esc(c.customerName)}">
    <div class="row"><label for="pad">Sign below with your finger</label><button type="button" class="link" id="clear">Clear</button></div>
    <canvas id="pad" tabindex="0" aria-label="Signature area"></canvas>
    <p class="err" id="err" role="alert" hidden></p>
    <button class="btn" id="sign">Sign and confirm</button>`;
  const pad = document.getElementById('pad'), ctx = pad.getContext('2d'), err = document.getElementById('err');
  let inked = false, drawing = false;
  const fit = () => {
    const d = Math.min(devicePixelRatio || 1, 2);
    pad.width = pad.offsetWidth * d; pad.height = pad.offsetHeight * d;
    ctx.scale(d, d); Object.assign(ctx, { lineWidth: 2.5, lineCap: 'round', lineJoin: 'round', strokeStyle: '#0f1f24' });
    inked = false;
  };
  fit();
  const at = (e) => { const r = pad.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  pad.onpointerdown = (e) => { drawing = true; pad.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...at(e)); ctx.lineTo(...at(e)); ctx.stroke(); inked = true; };
  pad.onpointermove = (e) => { if (drawing) { ctx.lineTo(...at(e)); ctx.stroke(); } };
  pad.onpointerup = pad.onpointercancel = () => { drawing = false; };
  document.getElementById('clear').onclick = fit;
  const btn = document.getElementById('sign');
  btn.onclick = async () => {
    const customerName = document.getElementById('name').value.trim();
    const miss = !customerName ? 'Please type your name.' : !inked ? 'Please sign in the box.' : '';
    err.hidden = !miss; err.textContent = miss;
    if (miss) return;
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const res = await fetch(`/api/sign/${encodeURIComponent(code)}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ customerName, signature: pad.toDataURL('image/png') }) });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || 'Something went wrong');
      signed(body);
    } catch (e) {
      err.hidden = false; err.textContent = `${e.message === 'Failed to fetch' ? 'No connection' : e.message} — please try again.`;
      btn.disabled = false; btn.textContent = 'Sign and confirm';
    }
  };
}

fetch(`/api/sign/${encodeURIComponent(code)}`).then(async (res) => {
  const c = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(c.error || 'This link is not valid');
  document.getElementById('sub').textContent = c.kind === 'condition' ? 'Property condition before work' : 'Change to agreed work';
  photos = c.photos || [];
  c.signed ? signed(c) : form(c);
}).catch((e) => { app.innerHTML = `<h1>Link not available</h1><p class="muted">${esc(e.message === 'Failed to fetch' ? 'No connection — please try again.' : e.message)}</p><p class="muted">If you think this is a mistake, contact LCC Bathrooms &amp; Services.</p>`; });
</script>
</body>
</html>
